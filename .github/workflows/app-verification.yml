name: Build and Spec Parse

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Build app and parse pilot-critical specs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://goodhours:goodhours@localhost:5432/goodhours_ci
      JWT_SECRET: ci-only-release-verification-secret-not-for-production
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goodhours
          POSTGRES_PASSWORD: goodhours
          POSTGRES_DB: goodhours_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U goodhours -d goodhours_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json

      - name: Install root test tooling
        run: npm ci --ignore-scripts

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Validate Prisma schema and migration history
        working-directory: server
        run: |
          npx prisma validate
          npx prisma migrate deploy
          npx prisma migrate status

      - name: Run server tests
        working-directory: server
        env:
          APP_ENV: test
          NODE_ENV: test
          VERCEL_ENV: development
        run: npm test

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          (cd server && npm audit --omit=dev --audit-level=high)
          (cd client && npm run security:verify-react-router-rsc-advisory)
          (cd client && npm run security:verify-no-rsc)

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Diff sanity check
        run: git diff --check

      - name: Parse pilot-critical Playwright specs
        run: npx playwright test tests/launch-center.spec.ts tests/intervention-workflow.spec.ts --list
