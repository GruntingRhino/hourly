name: Upload Cleanup

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  run-upload-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger upload cleanup cycle
        run: |
          OIDC_TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=goodhours-internal-cron" \
            | jq -r '.value')

          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $OIDC_TOKEN" \
            "https://goodhours.app/api/internal/upload-cleanup/run"
