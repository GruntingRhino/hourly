name: Production database migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_PRODUCTION_MIGRATIONS to authorize the gated run"
        required: true
        type: string

# Manual-only. Configure the GitHub `production` environment with required
# reviewers, PRODUCTION_DATABASE_HOST, PRODUCTION_DATABASE_NAME, and the
# uniquely named GOODHOURS_PRODUCTION_DATABASE_URL secret. The environment's
# reviewer configuration is an external GitHub setting, not provable in YAML.
permissions:
  contents: read

concurrency:
  group: goodhours-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify production schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      WORKFLOW_REF: ${{ github.ref }}
      REVIEWED_SHA: ${{ github.sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      EXPECTED_DB_HOST: ${{ vars.PRODUCTION_DATABASE_HOST }}
      EXPECTED_DB_NAME: ${{ vars.PRODUCTION_DATABASE_NAME }}
    steps:
      - name: Enforce production-only explicit confirmation and target configuration
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.GOODHOURS_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main" || {
            echo "Refusing migration: workflow must run from refs/heads/main (got $WORKFLOW_REF)." >&2
            exit 1
          }
          test "$CONFIRMATION" = "APPLY_PRODUCTION_MIGRATIONS" || {
            echo "Refusing migration: explicit confirmation did not match." >&2
            exit 1
          }
          test -n "${EXPECTED_DB_HOST:-}" || {
            echo "Refusing migration: production environment variable PRODUCTION_DATABASE_HOST is not configured." >&2
            exit 1
          }
          test -n "${EXPECTED_DB_NAME:-}" || {
            echo "Refusing migration: production environment variable PRODUCTION_DATABASE_NAME is not configured." >&2
            exit 1
          }
          test -n "${PRODUCTION_DATABASE_URL:-}" || {
            echo "Refusing migration: production environment secret GOODHOURS_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          }
          EXPECTED_DB_HOST="$EXPECTED_DB_HOST" EXPECTED_DB_NAME="$EXPECTED_DB_NAME" \
            node <<'NODE'
          const value = process.env.PRODUCTION_DATABASE_URL;
          const expectedHost = process.env.EXPECTED_DB_HOST;
          const expectedName = process.env.EXPECTED_DB_NAME;
          let parsed;
          let actualName;
          try {
            parsed = new URL(value);
            actualName = decodeURIComponent(parsed.pathname.replace(/^\//, ''));
          } catch {
            console.error("Refusing migration: production database secret is not a valid URL.");
            process.exit(1);
          }
          if (!['postgres:', 'postgresql:'].includes(parsed.protocol)) {
            console.error("Refusing migration: production database URL must use PostgreSQL.");
            process.exit(1);
          }
          if (parsed.hostname !== expectedHost.toLowerCase() || actualName !== expectedName) {
            console.error("Refusing migration: database URL identity does not match the configured production host/database.");
            process.exit(1);
          }
          console.log("PRODUCTION_DATABASE_IDENTITY=verified");
          NODE

      - name: Record reviewed commit
        run: |
          set -euo pipefail
          printf 'REVIEWED_SHA=%s\n' "$REVIEWED_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Reviewed workflow commit recorded: $REVIEWED_SHA"

      - name: Checkout reviewed commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked out commit is the reviewed SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA" || {
            echo "Refusing migration: checkout did not resolve to the reviewed SHA." >&2
            exit 1
          }
          echo "CHECKED_OUT_SHA=$REVIEWED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Prisma CLI without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev

      - name: Generate Prisma client
        run: npx prisma generate --schema=server/prisma/schema.prisma

      - name: Apply forward-only migrations
        env:
          DATABASE_URL: ${{ secrets.GOODHOURS_PRODUCTION_DATABASE_URL }}
        run: npx prisma migrate deploy --schema=server/prisma/schema.prisma

      - name: Verify migration ledger and actual schema
        env:
          DATABASE_URL: ${{ secrets.GOODHOURS_PRODUCTION_DATABASE_URL }}
        run: |
          set -euo pipefail
          npx prisma migrate status --schema=server/prisma/schema.prisma
          diff_output="$(npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel server/prisma/schema.prisma \
            --script)"
          normalized_diff="$(printf '%s' "$diff_output" | sed '/^[[:space:]]*$/d')"
          if [ -n "$normalized_diff" ] && [ "$normalized_diff" != "-- This is an empty migration." ]; then
            echo "Production schema differs from the repository datamodel after migration." >&2
            printf '%s\n' "$diff_output" >&2
            exit 1
          fi
          echo "PRODUCTION_SCHEMA_MATCH=verified"
