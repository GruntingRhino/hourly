name: Refresh Directory Data

on:
  schedule:
    # Every Sunday at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-download even if files are fresh"
        required: false
        default: "false"
      irs_only:
        description: "Only refresh IRS beneficiary data (skip school staleness check)"
        required: false
        default: "false"

jobs:
  refresh:
    name: Refresh Schools & Beneficiaries
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Refresh IRS + school directory
        working-directory: server
        run: |
          ARGS=""
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ "${{ github.event.inputs.irs_only }}" = "true" ] && ARGS="$ARGS --irs-only"
          npx tsx scripts/refresh-directory.ts $ARGS

      - name: Geocode new street-address entries (Census API)
        working-directory: server
        run: npx tsx scripts/geocode-directory.ts --batch=25

      - name: Fill remaining via zip centroid (PO Box fallback)
        working-directory: server
        run: npx tsx scripts/geocode-zipcentroid.ts
